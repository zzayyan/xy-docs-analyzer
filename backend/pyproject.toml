[project]
name = "docs-analyzer"
version = "0.1.0"
description = "Document analyzer: vector RAG for short docs, section tree + knowledge graph for long docs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling",
    "transformers",
    "langgraph",
    "langchain-ollama",
    "langchain-neo4j",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "streamlit",
    "langchain-openai>=1.6.2",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
